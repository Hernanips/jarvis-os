        // =========================================================================
        // 0. TEMA DÍA / NOCHE NOTHING OS (Automático del SO + botón manual inteligente)
        // =========================================================================
        function aplicarTemaUI() {
            const guardado = localStorage.getItem('jarvis_theme'); // 'light' | 'dark' | null (auto)
            const sistemaClaro = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            const esClaro = guardado ? guardado === 'light' : sistemaClaro;

            if (guardado) {
                document.documentElement.setAttribute('data-theme', guardado);
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', esClaro ? '#F3F3F3' : '#141414');

            const icon = document.getElementById('themeIconSvg');
            if (icon) {
                icon.innerHTML = esClaro
                    ? `<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>`
                    : `<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>`;
            }
        }

        function alternarTema() {
            vibrar(10);
            const guardado = localStorage.getItem('jarvis_theme');
            const sistemaClaro = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            const actualEsClaro = guardado ? guardado === 'light' : sistemaClaro;
            const nuevoEsClaro = !actualEsClaro;

            // Si coincide con el tema del SO, volvemos a modo automático para seguir sus cambios
            if (nuevoEsClaro === sistemaClaro) {
                localStorage.removeItem('jarvis_theme');
            } else {
                localStorage.setItem('jarvis_theme', nuevoEsClaro ? 'light' : 'dark');
            }
            aplicarTemaUI();
        }

        aplicarTemaUI();
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', aplicarTemaUI);
        }

        // =========================================================================
        // 1. MODAL DE MEMORIAS CLON DE CLAUDE (Temas / Áreas + Vista Detalle)
        // =========================================================================
        let memoriasCache = [];
        let memoriaActivaId = null;

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatearFechaRelativaMem(iso) {
            if (!iso) return '';
            const fecha = new Date(iso);
            const diffDias = Math.floor((Date.now() - fecha.getTime()) / 86400000);
            if (diffDias <= 0) return 'Actualizado hoy';
            if (diffDias === 1) return 'Actualizado ayer';
            if (diffDias < 7) return `Actualizado hace ${diffDias} días`;
            return 'Actualizado ' + fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function formatearFechaLargaMem(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function normalizarItemMemoria(m) {
            const titulo = m.title || (m.category || 'General').replace(/[_-]+/g, ' ');
            const detalles = Array.isArray(m.details) && m.details.length > 0
                ? m.details
                : String(m.fact || '').split('\n').map(s => s.replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
            const resumen = m.summary || detalles[0] || m.fact || '';
            return {
                ...m,
                kind: m.kind === 'area' ? 'area' : 'tema',
                title: titulo,
                summary: resumen,
                details: detalles
            };
        }

        // Convierte referencias a otros bloques (ej. "carrera-8k") en enlaces clicables dentro de Detalles
        function enlazarSlugsMemoria(textoSeguro) {
            let html = textoSeguro;
            for (const m of memoriasCache) {
                if (!m.category || m.id === memoriaActivaId) continue;
                const slugEscapado = m.category.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`\\b(${slugEscapado})\\b`, 'gi');
                html = html.replace(regex, `<span class="mem-slug-link" onclick="abrirDetalleMemoria('${m.id}')">$1</span>`);
            }
            return html;
        }

        async function abrirModalMemorias() {
            vibrar(12);
            memoriaActivaId = null;
            const mModal = document.getElementById('memories-modal');
            if (mModal) mModal.style.display = 'flex';
            await cargarListaMemoriasUI();
        }

        function cerrarModalMemorias() {
            const mModal = document.getElementById('memories-modal');
            if (mModal) mModal.style.display = 'none';
            memoriaActivaId = null;
        }

        function renderizarVistaMemorias() {
            const bodyEl = document.getElementById('memories-body');
            const headerLeft = document.getElementById('mem-header-left');
            const inputEl = document.getElementById('memEditInput');

            const activa = memoriaActivaId ? memoriasCache.find(x => x.id === memoriaActivaId) : null;

            if (activa) {
                headerLeft.innerHTML = `<button class="mem-back-btn" onclick="volverAListaMemorias()">← Memoria de Jarvis</button>`;
                inputEl.placeholder = `Dile a Jarvis qué cambiar en "${activa.title}"...`;

                const bullets = activa.details
                    .map(d => `<li>${enlazarSlugsMemoria(escapeHtml(d))}</li>`)
                    .join('');

                bodyEl.innerHTML = `
                    <div class="mem-detail-top">
                        <div class="mem-detail-title">${escapeHtml(activa.title)}</div>
                        <button class="mem-delete-btn" onclick="borrarMemoriaUI('${activa.id}')">Eliminar</button>
                    </div>
                    <div class="mem-detail-label">Última actualización</div>
                    <div class="mem-detail-text">${formatearFechaLargaMem(activa.updated_at)}</div>

                    <div class="mem-detail-label">Resumen</div>
                    <div class="mem-detail-text">${escapeHtml(activa.summary)}</div>

                    <div class="mem-detail-label">Detalles</div>
                    <ul class="mem-detail-list">${bullets || '<li>Sin detalles adicionales.</li>'}</ul>
                `;
                return;
            }

            headerLeft.innerHTML = `<span>MEMORIA // JARVIS</span>`;
            inputEl.placeholder = 'Dile a Jarvis qué debe cambiar...';

            if (memoriasCache.length === 0) {
                bodyEl.innerHTML = `<div style="font-size:13px; color:var(--text-muted); padding:28px 10px; text-align:center; line-height:1.5;">Aún no hay bloques guardados. Háblale a Jarvis de tus proyectos, rutinas u objetivos y los irá organizando automáticamente en Temas y Áreas.</div>`;
                return;
            }

            const temas = memoriasCache.filter(m => m.kind === 'tema');
            const areas = memoriasCache.filter(m => m.kind === 'area');

            const renderGrupo = (tituloSeccion, lista) => {
                if (lista.length === 0) return '';
                const filas = lista.map(m => `
                    <div class="mem-row" onclick="abrirDetalleMemoria('${m.id}')">
                        <div class="mem-row-title">${escapeHtml(m.title)}</div>
                        <div class="mem-row-summary">${escapeHtml(m.summary)}</div>
                        <div class="mem-row-date">${formatearFechaRelativaMem(m.updated_at)}</div>
                    </div>
                `).join('');
                return `<div class="mem-section-title">${tituloSeccion}</div>${filas}`;
            };

            bodyEl.innerHTML = renderGrupo('Temas', temas) + renderGrupo('Áreas', areas);
        }

        function abrirDetalleMemoria(id) {
            vibrar(10);
            memoriaActivaId = id;
            renderizarVistaMemorias();
        }

        function volverAListaMemorias() {
            vibrar(8);
            memoriaActivaId = null;
            renderizarVistaMemorias();
        }

        async function cargarListaMemoriasUI() {
            const bodyEl = document.getElementById('memories-body');
            bodyEl.innerHTML = `<div style="font-size:12.5px; color:var(--text-muted); padding:12px;">Cargando memoria...</div>`;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const sesionActiva = session || currentSession;
                if (!sesionActiva) return;

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`
                    },
                    body: JSON.stringify({ mode: 'list_memories' })
                });

                const data = await res.json();
                memoriasCache = (data.memories || []).map(normalizarItemMemoria);
                renderizarVistaMemorias();
            } catch (e) {
                bodyEl.innerHTML = `<div style="font-size:12.5px; color:var(--nothing-red); padding:12px;">Error al leer memorias.</div>`;
            }
        }

        async function borrarMemoriaUI(id) {
            vibrar(15);
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const sesionActiva = session || currentSession;
                if (!sesionActiva) return;

                await fetch('/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`
                    },
                    body: JSON.stringify({ mode: 'delete_memory', memoryId: id })
                });
                memoriaActivaId = null;
                await cargarListaMemoriasUI();
            } catch (e) {}
        }

        async function enviarEdicionMemoria(event) {
            event.preventDefault();
            const inputEl = document.getElementById('memEditInput');
            const sendBtnEl = document.getElementById('memEditSendBtn');
            const instruccion = inputEl.value.trim();
            if (!instruccion) return;

            vibrar(12);
            const activa = memoriaActivaId ? memoriasCache.find(x => x.id === memoriaActivaId) : null;
            const slugActivo = activa ? activa.category : null;

            inputEl.disabled = true;
            sendBtnEl.disabled = true;
            const prevPlaceholder = inputEl.placeholder;
            inputEl.value = '';
            inputEl.placeholder = 'Actualizando memoria...';

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const sesionActiva = session || currentSession;
                if (!sesionActiva) return;

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`
                    },
                    body: JSON.stringify({
                        mode: 'edit_memory_prompt',
                        instruction: instruccion,
                        activeTopic: slugActivo
                    })
                });

                const data = await res.json().catch(() => ({}));
                if (Array.isArray(data.memories)) {
                    memoriasCache = data.memories.map(normalizarItemMemoria);
                    if (memoriaActivaId && !memoriasCache.some(m => m.id === memoriaActivaId)) {
                        memoriaActivaId = null;
                    }
                    renderizarVistaMemorias();
                }
            } catch (e) {
                console.error('Error editando memoria:', e);
            } finally {
                inputEl.disabled = false;
                sendBtnEl.disabled = false;
                inputEl.placeholder = prevPlaceholder;
            }
        }

        // =========================================================================
        // 2. GESTIÓN DE ATAJOS + SELECTOR DE ICONOS SVG + REORDENAR
        // =========================================================================
        function obtenerClaveStorageAtajos() {
            return `jarvis_shortcuts_${currentUserId}`;
        }

        function cargarAtajosUsuario() {
            try {
                const guardados = localStorage.getItem(obtenerClaveStorageAtajos());
                if (guardados) {
                    const parsed = JSON.parse(guardados);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...ATAJOS_POR_DEFECTO];
        }

        function guardarAtajosEnStorage(lista) {
            localStorage.setItem(obtenerClaveStorageAtajos(), JSON.stringify(lista));
            renderizarBarraAtajos();
            renderizarListaModalAtajos();
        }

        function renderizarPanelSelectorIconos() {
            const panel = document.getElementById('iconPickerPanel');
            const seleccionado = document.getElementById('shortcutIconKey').value || 'calendar';
            const trigger = document.getElementById('iconPickerTrigger');
            trigger.innerHTML = obtenerSvgIcono(seleccionado);

            panel.innerHTML = '';
            Object.keys(ICON_PACK).forEach(key => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `icon-option-btn ${key === seleccionado ? 'selected' : ''}`;
                btn.innerHTML = ICON_PACK[key];
                btn.onclick = () => seleccionarIconoAtajo(key);
                panel.appendChild(btn);
            });
        }

        function togglePanelIconos() {
            document.getElementById('iconPickerPanel').classList.toggle('open');
        }

        function seleccionarIconoAtajo(key) {
            document.getElementById('shortcutIconKey').value = key;
            document.getElementById('iconPickerPanel').classList.remove('open');
            renderizarPanelSelectorIconos();
        }

        function renderizarBarraAtajos() {
            const container = document.getElementById('quick-actions-container');
            const atajos = cargarAtajosUsuario();
            container.innerHTML = '';

            atajos.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.disabled = isGenerating;
                btn.innerHTML = `${obtenerSvgIcono(item.icon)}<span>${item.label}</span>`;
                btn.onclick = () => enviarRapido(item.prompt);
                container.appendChild(btn);
            });

            const manageBtn = document.createElement('button');
            manageBtn.className = 'chip-action';
            manageBtn.innerHTML = '<span>＋ Atajo</span>';
            manageBtn.onclick = abrirModalAtajos;
            container.appendChild(manageBtn);
        }

        function abrirModalAtajos() {
            resetFormularioAtajo();
            renderizarListaModalAtajos();
            shortcutsModal.style.display = 'flex';
        }

        function cerrarModalAtajos() {
            shortcutsModal.style.display = 'none';
        }

        function moverAtajo(index, direccion) {
            const atajos = cargarAtajosUsuario();
            const nuevoIndex = index + direccion;
            if (nuevoIndex < 0 || nuevoIndex >= atajos.length) return;
            const temp = atajos[index];
            atajos[index] = atajos[nuevoIndex];
            atajos[nuevoIndex] = temp;
            guardarAtajosEnStorage(atajos);
        }

        function renderizarListaModalAtajos() {
            const listEl = document.getElementById('shortcuts-list');
            const atajos = cargarAtajosUsuario();
            listEl.innerHTML = '';

            atajos.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'shortcut-item';
                row.innerHTML = `
                    <div class="shortcut-info">
                        <div class="shortcut-icon-preview">${obtenerSvgIcono(item.icon)}</div>
                        <div class="shortcut-text-group">
                            <div class="shortcut-title">${item.label}</div>
                            <div class="shortcut-prompt">${item.prompt}</div>
                        </div>
                    </div>
                    <div class="shortcut-item-actions">
                        <button class="mini-icon-btn" onclick="moverAtajo(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Subir">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="18 15 12 9 6 15"/></svg>
                        </button>
                        <button class="mini-icon-btn" onclick="moverAtajo(${idx}, 1)" ${idx === atajos.length - 1 ? 'disabled' : ''} title="Bajar">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <button class="mini-icon-btn" onclick="prepararEdicionAtajo(${idx})" title="Editar">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </button>
                        <button class="mini-icon-btn delete" onclick="eliminarAtajo(${idx})" title="Borrar">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function prepararEdicionAtajo(index) {
            const atajos = cargarAtajosUsuario();
            const item = atajos[index];
            if (!item) return;
            document.getElementById('form-shortcut-title').textContent = 'Editar atajo';
            document.getElementById('shortcutIconKey').value = ICON_PACK[item.icon] ? item.icon : 'calendar';
            document.getElementById('shortcutLabelInput').value = item.label;
            document.getElementById('shortcutPromptInput').value = item.prompt;
            document.getElementById('shortcutEditIndex').value = String(index);
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            renderizarPanelSelectorIconos();
        }

        function resetFormularioAtajo() {
            document.getElementById('form-shortcut-title').textContent = 'Añadir nuevo atajo';
            document.getElementById('shortcutIconKey').value = 'calendar';
            document.getElementById('shortcutLabelInput').value = '';
            document.getElementById('shortcutPromptInput').value = '';
            document.getElementById('shortcutEditIndex').value = '-1';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('iconPickerPanel').classList.remove('open');
            renderizarPanelSelectorIconos();
        }

        function guardarAtajo() {
            const icon = document.getElementById('shortcutIconKey').value || 'calendar';
            const label = document.getElementById('shortcutLabelInput').value.trim();
            const prompt = document.getElementById('shortcutPromptInput').value.trim();
            const editIdx = parseInt(document.getElementById('shortcutEditIndex').value, 10);

            if (!label || !prompt) return alert('Rellena el nombre y la instrucción del atajo.');

            const atajos = cargarAtajosUsuario();
            if (editIdx >= 0 && editIdx < atajos.length) {
                atajos[editIdx] = { icon, label, prompt };
            } else {
                atajos.push({ icon, label, prompt });
            }

            guardarAtajosEnStorage(atajos);
            resetFormularioAtajo();
        }

        function eliminarAtajo(index) {
            const atajos = cargarAtajosUsuario();
            atajos.splice(index, 1);
            guardarAtajosEnStorage(atajos);
        }

        function setEstadoGenerando(activo) {
            isGenerating = activo;
            userInput.disabled = activo;
            sendBtn.disabled = activo;
            micBtn.disabled = activo;
            document.querySelectorAll('.chip').forEach(btn => btn.disabled = activo);
        }

        function actualizarEstadoConexion(estado) {
            const dot = document.querySelector('.status-dot');
            if (!dot) return;
            dot.style.backgroundColor = '#D71921';
            dot.style.boxShadow = estado === 'online'
                ? '0 0 8px rgba(215, 25, 33, 0.85)'
                : 'none';
        }

        // =========================================================================
        // 3. AUTH SUPABASE + SINCRONIZACIÓN DE REFRESH TOKEN
        // =========================================================================
        function marcarStravaConectadoUI(conectado) {
            const btn = document.getElementById('stravaBtn');
            if (!btn) return;
            if (conectado) {
                btn.style.borderColor = '#D71921';
                btn.style.color = 'var(--text-strong)';
                btn.title = 'Strava conectado';
            }
        }

        function conectarStrava() {
            vibrar(12);
            if (!stravaClientIdGlobal) {
                return alert('Falta STRAVA_CLIENT_ID en las variables de entorno de Vercel.');
            }
            const redirectUri = encodeURIComponent(window.location.origin);
            const scope = 'read,activity:read_all,profile:read_all';
            window.location.href = `https://www.strava.com/oauth/authorize?client_id=${stravaClientIdGlobal}&response_type=code&redirect_uri=${redirectUri}&approval_prompt=auto&scope=${scope}`;
        }

        async function sincronizarRefreshTokenEnServidor(accessToken) {
            if (!accessToken) return;
            try {
                // Si venimos de autorizar Strava con ?code= en la URL, lo canjeamos automáticamente
                if (pendingStravaCode) {
                    const codeToExchange = pendingStravaCode;
                    pendingStravaCode = null;
                    window.history.replaceState(null, '', window.location.pathname);
                    const resSt = await fetch('/api', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        },
                        body: JSON.stringify({ mode: 'strava_exchange', code: codeToExchange })
                    });
                    const dataSt = await resSt.json().catch(() => ({}));
                    if (dataSt.stravaConnected) {
                        marcarStravaConectadoUI(true);
                        chatBox.innerHTML += `<div class="message assistant">✅ <strong>Strava vinculado correctamente.</strong> Ya tengo acceso en tiempo real a tus carreras, rutas en bici, sesiones de gimnasio y pulsaciones.</div>`;
                    }
                }

                const rToken = localStorage.getItem('jarvis_google_refresh_token') || '';
                const res = await fetch('/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`,
                        'X-Google-Refresh-Token': rToken
                    },
                    body: JSON.stringify({ syncTokenOnly: true })
                });
                const data = await res.json().catch(() => ({}));
                if (data.stravaConnected) marcarStravaConectadoUI(true);
            } catch (e) {}
        }

        function crearClienteSupabase(url, key) {
            if (supabaseClient) return supabaseClient;
            supabaseClient = supabase.createClient(url, key, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    lock: async (_name, _acquireTimeout, fn) => await fn()
                }
            });

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                currentSession = session || null;
                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    if (session.provider_refresh_token) {
                        localStorage.setItem('jarvis_google_refresh_token', session.provider_refresh_token);
                    }
                    sincronizarRefreshTokenEnServidor(session.access_token);
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                    if (window.location.hash && window.location.hash.includes('access_token=')) {
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                }
            });

            return supabaseClient;
        }

        async function initApp() {
            renderizarBarraAtajos();
            renderizarPanelSelectorIconos();

            if (typeof supabase === 'undefined' || !supabase.createClient) {
                setTimeout(initApp, 300);
                return;
            }

            try {
                const res = await fetch('/api');
                if (!res.ok) throw new Error(`Error HTTP ${res.status} en /api`);
                
                const config = await res.json();
                if (config.stravaClientId) stravaClientIdGlobal = config.stravaClientId;

                localStorage.setItem('jarvis_supa_config', JSON.stringify(config));
                crearClienteSupabase(config.supabaseUrl, config.supabaseAnonKey);

                const { data: { session } } = await supabaseClient.auth.getSession();
                currentSession = session || null;

                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    if (session.provider_refresh_token) {
                        localStorage.setItem('jarvis_google_refresh_token', session.provider_refresh_token);
                    }
                    sincronizarRefreshTokenEnServidor(session.access_token);
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                } else {
                    authModal.style.display = 'flex';
                }
                actualizarEstadoConexion('online');
            } catch (e) {
                console.error("❌ Error inicializando Supabase:", e);
                actualizarEstadoConexion('offline');
                authModal.style.display = 'flex';
            }
        }

        initApp();

        async function loginGoogle() {
            try {
                if (!supabaseClient) await initApp();
                if (!supabaseClient) return;
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin,
                        scopes: 'https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/calendar',
                        queryParams: {
                            access_type: 'offline',
                            prompt: 'consent'
                        }
                    }
                });
                if (error) alert('Error al conectar con Google: ' + error.message);
            } catch (err) {
                alert('Error en login: ' + err.message);
            }
        }

        async function logout() {
            currentSession = null;
            localStorage.removeItem('jarvis_google_token');
            localStorage.removeItem('jarvis_google_refresh_token');
            Object.keys(localStorage).forEach(k => {
                if (k.startsWith('sb-')) localStorage.removeItem(k);
            });

            if (supabaseClient) {
                try {
                    await Promise.race([
                        supabaseClient.auth.signOut(),
                        new Promise(resolve => setTimeout(resolve, 800))
                    ]);
                } catch (e) {}
            }
            window.location.href = window.location.origin;
        }

        // Formateador Markdown rico estilo Nothing OS (listas limpias y badges monoespaciados)
        function formatearTexto(texto) {
            const lineas = String(texto || '').split('\n');
            const procesadas = lineas.map(linea => {
                const trimmed = linea.trim();

                if (/^-{3,}$/.test(trimmed)) {
                    return `<hr class="msg-divider">`;
                }
                if (/^#{1,3}\s+/.test(trimmed)) {
                    const titulo = trimmed.replace(/^#{1,3}\s+/, '').replace(/\*\*(.*?)\*\*/g, '$1');
                    return `<div class="msg-heading">${titulo}</div>`;
                }

                const esLista = /^\s*[-•*]\s+/.test(linea);
                let l = esLista ? linea.replace(/^\s*[-•*]\s+/, '') : linea;

                l = l
                    .replace(/`([^`\n]+)`/g, '<span class="nothing-badge">$1</span>')
                    .replace(/~~(.*?)~~/g, '<del style="opacity:0.55;">$1</del>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>')
                    .replace(/\[PENDIENTE\]/gi, '<span class="nothing-badge pending">PENDIENTE</span>')
                    .replace(/\[HECHA\]/gi, '<span class="nothing-badge done">HECHA</span>')
                    .replace(/(\b\d+(?:[.,]\d+)?\s*(?:kcal|g\b|kg\b))/gi, '<span class="nothing-badge">$1</span>');

                if (esLista) {
                    return `<div class="msg-list-item"><span class="msg-bullet">▪</span><span>${l}</span></div>`;
                }
                return l;
            });

            return procesadas
                .join('<br>')
                .replace(/<\/div><br><div class="msg-list-item">/g, '</div><div class="msg-list-item">')
                .replace(/(?:<br>)*<hr class="msg-divider">(?:<br>)*/g, '<hr class="msg-divider">')
                .replace(/(?:<br>)*<div class="msg-heading">/g, '<div class="msg-heading">')
                .replace(/<\/div><br>/g, '</div>');
        }

        function enviarRapido(texto) {
            if (isGenerating) return;
            vibrar(12);
            userInput.value = texto;
            ajustarAlturaInput();
            enviarMensaje();
        }

        // =========================================================================
        // 4. GRABACIÓN CON LAS 48 ONDAS REALES + TRANSCRIPCIÓN GEMINI
        // =========================================================================
        let isRecording = false;
        let audioCtx = null;
        let analyserNode = null;
        let micStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let rafWaveId = null;

        function ponerBarrasACero() {
            cancelAnimationFrame(rafWaveId);
            for (let i = 0; i < NUM_WAVE_BARS; i++) {
                waveBarElements[i].style.height = '3px';
                waveBarElements[i].classList.remove('active');
            }
        }

        function cambiarIconoBotonMicro(grabando) {
            if (grabando) {
                micIconSvg.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"></rect>`;
            } else {
                micIconSvg.innerHTML = `
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" x2="12" y1="19" y2="22"></line>
                `;
            }
        }

        function blobABase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const res = String(reader.result || '');
                    const base64 = res.split(',')[1] || '';
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function iniciarGrabacion() {
            if (isGenerating || isRecording) return;
            vibrar(16);

            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const source = audioCtx.createMediaStreamSource(micStream);
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 128;
                analyserNode.smoothingTimeConstant = 0.65;
                source.connect(analyserNode);

                audioChunks = [];
                const recOptions = { audioBitsPerSecond: 64000 };
                if (window.MediaRecorder) {
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        recOptions.mimeType = 'audio/webm;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        recOptions.mimeType = 'audio/webm';
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        recOptions.mimeType = 'audio/mp4';
                    }
                    mediaRecorder = new MediaRecorder(micStream, recOptions);
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) audioChunks.push(e.data);
                    };
                    // Volcamos bloques cada 250ms para que en PC no se pierda el final de la frase
                    mediaRecorder.start(250);
                }

                isRecording = true;
                ponerBarrasACero();
                inputArea.classList.add('listening');
                cambiarIconoBotonMicro(true);

                const dataArray = new Uint8Array(analyserNode.frequencyBinCount);

                function loopFrecuencias() {
                    if (!isRecording) return;
                    analyserNode.getByteFrequencyData(dataArray);

                    let suma = 0;
                    for (let j = 1; j < 28; j++) suma += dataArray[j];
                    const promedio = suma / 27;

                    if (promedio < 10) {
                        for (let i = 0; i < NUM_WAVE_BARS; i++) {
                            waveBarElements[i].style.height = '3px';
                            waveBarElements[i].classList.remove('active');
                        }
                    } else {
                        const mitad = NUM_WAVE_BARS / 2;
                        for (let i = 0; i < NUM_WAVE_BARS; i++) {
                            const distCentro = Math.abs(i - mitad) / mitad;
                            const binIdx = 1 + Math.floor(distCentro * 24);
                            const val = dataArray[binIdx] || 0;
                            const envolventeBordes = Math.max(0.25, 1 - Math.pow(distCentro, 1.6) * 0.7);
                            const px = Math.max(3, Math.min(34, Math.round((val / 255) * 36 * envolventeBordes)));
                            waveBarElements[i].style.height = `${px}px`;
                            if (px > 5) {
                                waveBarElements[i].classList.add('active');
                            } else {
                                waveBarElements[i].classList.remove('active');
                            }
                        }
                    }

                    rafWaveId = requestAnimationFrame(loopFrecuencias);
                }

                loopFrecuencias();
            } catch (err) {
                alert('No se pudo acceder al micrófono: ' + err.message);
            }
        }

        async function finalizarAudioYTranscribir() {
            if (!isRecording) return '';
            vibrar(12);
            isRecording = false;
            ponerBarrasACero();
            inputArea.classList.remove('listening');
            cambiarIconoBotonMicro(false);

            const blob = await new Promise((resolve) => {
                if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                    resolve(null);
                    return;
                }
                const mime = mediaRecorder.mimeType || 'audio/webm';
                mediaRecorder.onstop = () => {
                    const b = new Blob(audioChunks, { type: mime });
                    resolve(b);
                };
                try {
                    mediaRecorder.stop();
                } catch (e) {
                    resolve(null);
                }
            });

            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }

            if (!blob || blob.size === 0) return '';

            const textoPrevio = userInput.value.trim();
            const placeholderOriginal = userInput.placeholder;
            userInput.placeholder = 'Transcribiendo voz...';
            userInput.disabled = true;

            try {
                const audioBase64 = await blobABase64(blob);
                const { data: { session } } = await supabaseClient.auth.getSession();
                const sesionActiva = session || currentSession;
                if (!sesionActiva) return '';

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`
                    },
                    body: JSON.stringify({
                        mode: 'transcribe',
                        audioBase64,
                        mimeType: blob.type || 'audio/webm'
                    })
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok || data.error) {
                    console.error('Error del servidor en transcripción:', data.error);
                    chatBox.innerHTML += `<div class="message assistant" style="color: var(--nothing-red);">Error transcribiendo audio: ${data.error || res.status}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    return '';
                }

                const nuevoTexto = (data.transcript || '').trim();

                if (nuevoTexto) {
                    const combinado = textoPrevio ? `${textoPrevio} ${nuevoTexto}` : nuevoTexto;
                    userInput.value = combinado;
                }
            } catch (e) {
                console.error('Error transcribiendo audio:', e);
            } finally {
                userInput.disabled = false;
                userInput.placeholder = placeholderOriginal;
                ajustarAlturaInput();
            }

            return userInput.value.trim();
        }

        async function toggleDictado() {
            if (isGenerating) return;
            if (isRecording) {
                await finalizarAudioYTranscribir();
                userInput.focus();
            } else {
                await iniciarGrabacion();
            }
        }

        // =========================================================================
        // 5. ENVÍO DE MENSAJES
        // =========================================================================
        async function enviarMensaje() {
            if (isGenerating) return;

            if (isRecording) {
                await finalizarAudioYTranscribir();
            }

            const text = userInput.value.trim();
            if (!text) return;

            vibrar(14);
            userInput.value = '';
            ajustarAlturaInput();

            if (!supabaseClient) {
                await initApp();
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            const sesionActiva = session || currentSession;

            if (!sesionActiva) {
                authModal.style.display = 'flex';
                return;
            }

            setEstadoGenerando(true);

            chatBox.innerHTML += `<div class="message user">${text}</div>`;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="typing" id="${loadingId}"><span></span><span></span><span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const googleToken = sesionActiva.provider_token || localStorage.getItem('jarvis_google_token') || '';
                const googleRefreshToken = sesionActiva.provider_refresh_token || localStorage.getItem('jarvis_google_refresh_token') || '';

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`,
                        'X-Google-Token': googleToken,
                        'X-Google-Refresh-Token': googleRefreshToken
                    },
                    body: JSON.stringify({ message: text, history: historial })
                });

                document.getElementById(loadingId)?.remove();

                const data = await res.json().catch(() => ({}));

                if (data.newGoogleToken) {
                    localStorage.setItem('jarvis_google_token', data.newGoogleToken);
                }

                if (res.status === 401) {
                    chatBox.innerHTML += `<div class="message assistant" style="color: var(--nothing-red);">${data.error || 'Sesión expirada.'}</div>`;
                    authModal.style.display = 'flex';
                    setEstadoGenerando(false);
                    return;
                }

                if (!res.ok) {
                    const msgError = data.error || (res.status === 504
                        ? 'Tiempo de espera agotado (504). El servidor tardó demasiado en completar todas las acciones.'
                        : `Error del servidor (HTTP ${res.status}).`);
                    chatBox.innerHTML += `<div class="message assistant" style="color: var(--nothing-red);">${msgError}</div>`;
                    return;
                }

                const reply = data.reply || data.error || 'Sin respuesta del servidor.';
                const recibosHtml = renderizarRecibosHtml(data.actions);

                vibrar(10);
                chatBox.innerHTML += `<div class="message assistant">${formatearTexto(reply)}${recibosHtml}</div>`;
                
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message assistant" style="color: var(--nothing-red);">Error de conexión: ${err.message}</div>`;
            } finally {
                setEstadoGenerando(false);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => reg.update())
                    .catch((err) => console.log("Error al registrar el Service Worker:", err));
            });
        }

        function renderizarRecibosHtml(acciones) {
            if (!Array.isArray(acciones) || acciones.length === 0) return '';

            const chipsHtml = acciones.map(a => {
                const tipoLower = (a.type || '').toLowerCase();
                const esMem = tipoLower === 'memoria';
                const clickAttr = esMem ? 'onclick="abrirModalMemorias()"' : '';
                return `<div class="receipt-chip ${esMem ? 'clickable' : ''}" ${clickAttr}><span class="receipt-dot ${tipoLower}"></span><span class="receipt-type">${escapeHtml(a.type)}</span><span>${escapeHtml(a.label)}</span></div>`;
            }).join('');

            // Si son 4 o menos, se muestran directamente a la vista
            if (acciones.length <= 4) {
                return `<div class="action-receipts">${chipsHtml}</div>`;
            }

            // Si son 5 o más, generamos un resumen compacto desplegable
            let creadas = 0, borradas = 0, movidas = 0, hechas = 0, cal = 0, mem = 0, otras = 0;
            const tiposPresentes = new Set();

            acciones.forEach(a => {
                const t = (a.type || '').toUpperCase();
                const lbl = String(a.label || '');
                tiposPresentes.add(t.toLowerCase());

                if (t === 'TASKS') {
                    if (/^Borrada:/i.test(lbl)) borradas++;
                    else if (/→/.test(lbl)) movidas++;
                    else if (/\(Hecha\)/i.test(lbl)) hechas++;
                    else creadas++;
                } else if (t === 'CALENDAR') {
                    cal++;
                } else if (t === 'MEMORIA') {
                    mem++;
                } else {
                    otras++;
                }
            });

            const partes = [];
            if (creadas) partes.push(`${creadas} ${creadas === 1 ? 'creada' : 'creadas'}`);
            if (movidas) partes.push(`${movidas} ${movidas === 1 ? 'movida' : 'movidas'}`);
            if (hechas) partes.push(`${hechas} ${hechas === 1 ? 'hecha' : 'hechas'}`);
            if (borradas) partes.push(`${borradas} ${borradas === 1 ? 'borrada' : 'borradas'}`);
            if (cal) partes.push(`${cal} ${cal === 1 ? 'evento' : 'eventos'}`);
            if (mem) partes.push(`memoria`);
            if (otras) partes.push(`${otras} ${otras === 1 ? 'registro' : 'registros'}`);

            const dotsHtml = [...tiposPresentes]
                .map(t => `<span class="receipt-dot ${t}"></span>`)
                .join('');

            return `
                <div class="action-receipts">
                    <details class="receipts-accordion" ontoggle="vibrar(8)">
                        <summary class="receipts-summary">
                            <span class="receipts-summary-left">
                                <span class="receipts-summary-dots">${dotsHtml}</span>
                                <span class="receipts-summary-title">${acciones.length} ACCIONES</span>
                                <span>· ${partes.join(' · ')}</span>
                            </span>
                            <svg class="receipts-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </summary>
                        <div class="receipts-accordion-body">${chipsHtml}</div>
                    </details>
                </div>
            `;
        }
    </script>
