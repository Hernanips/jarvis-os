<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JARVIS // OS</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- MODAL DE ACCESO CON GOOGLE -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h2>JARVIS // AUTH</h2>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;">Conecta tu cuenta de Google para sincronizar tus calendarios, tareas y base de datos.</p>
            <div id="auth-error" class="auth-error-msg"></div>
            <button class="google-btn" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 11.7c0 1.83.43 3.56 1.18 5.08l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <!-- MODAL DE MEMORIA ESTILO CLAUDE -->
    <div id="memories-modal" class="modal-overlay">
        <div class="modal-card memory-modal-card">
            <div class="mem-header">
                <div class="mem-breadcrumb" id="mem-header-left">
                    <span>MEMORIA // JARVIS</span>
                </div>
                <button class="btn-secondary" id="closeMemoriesBtn" style="padding: 4px 10px;">✕</button>
            </div>

            <div id="memories-body" class="mem-body"></div>

            <div class="mem-footer-bar">
                <form class="mem-edit-form" id="memEditForm">
                    <input type="text" id="memEditInput" class="mem-edit-input" placeholder="Dile a Jarvis qué debe cambiar..." autocomplete="off">
                    <button type="submit" id="memEditSendBtn" class="mem-edit-send" title="Aplicar cambio">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DE GESTIÓN DE ATAJOS -->
    <div id="shortcuts-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>ATAJOS RÁPIDOS</h2>
                <button class="btn-secondary" id="closeShortcutsBtn" style="padding: 4px 10px;">✕</button>
            </div>
            <p style="font-size: 12px; color: var(--text-muted);">Reordena o personaliza tus accesos directos.</p>

            <div id="shortcuts-list" class="shortcut-list"></div>

            <hr style="border: none; border-top: 1px solid var(--border);">

            <div class="form-group">
                <label id="form-shortcut-title">Añadir nuevo atajo</label>
                <div class="form-row">
                    <button type="button" class="icon-picker-trigger" id="iconPickerTrigger" title="Cambiar icono"></button>
                    <input type="text" id="shortcutLabelInput" class="form-input" style="flex:1;" placeholder="Nombre (ej: Resumen del día)">
                </div>

                <div id="iconPickerPanel" class="icon-picker-panel"></div>

                <input type="text" id="shortcutPromptInput" class="form-input" placeholder="Instrucción (ej: ¿Cómo llevo el día?)">
                <input type="hidden" id="shortcutIconKey" value="calendar">
                <input type="hidden" id="shortcutEditIndex" value="-1">
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancelEditBtn" style="display: none;">Cancelar</button>
                <button class="btn-primary" id="saveShortcutBtn">Guardar</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="status-dot"></span>
                JARVIS // OS
            </div>
            <div class="header-actions">
                <button class="icon-top-btn" id="themeToggleBtn" title="Cambiar tema Día/Noche">
                    <svg id="themeIconSvg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path><path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path><path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                </button>
                <button class="icon-top-btn" id="stravaBtn" title="Conectar Strava">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                </button>
                <button class="icon-top-btn" id="memoryBtn" title="Memoria de Jarvis">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54Z"/>
                        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54Z"/>
                    </svg>
                </button>
                <button class="icon-top-btn" id="logoutBtn" title="Cerrar sesión">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="quick-actions-bar">
        <div class="quick-actions" id="quick-actions-container"></div>
    </div>

    <div id="chat-box">
        <div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas gestionamos hoy?</div>
    </div>

    <div class="input-wrapper">
        <div class="input-area" id="inputArea">
            <textarea id="userInput" rows="1" placeholder="Mensaje a Jarvis..."></textarea>
            <div class="waveform-slot" id="waveformBars"></div>

            <div class="input-actions">
                <button class="action-circle-btn" id="micBtn" title="Voz">
                    <svg id="micIconSvg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" x2="12" y1="19" y2="22"></line>
                    </svg>
                </button>

                <button class="send-btn" id="sendBtn" title="Enviar mensaje">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
