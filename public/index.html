<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1B1B1B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JARVIS // OS</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #141414;
            --bg-panel: #1C1C1C;
            --bg-card: #222222;
            --bg-input: #1E1E1E;
            --bg-hover: #2C2C2C;
            --bg-listening: #1B1B1B;
            --header-bg: rgba(20, 20, 20, 0.88);
            --overlay-bg: rgba(12, 12, 12, 0.86);
            --border: #2F2F2F;
            --border-strong: #525252;
            --text-main: #EFEFEF;
            --text-strong: #FFFFFF;
            --text-muted: #9A9A9A;
            --user-bubble-bg: #F1F1F1;
            --user-bubble-text: #141414;
            --btn-disabled-bg: #2B2B2B;
            --btn-disabled-text: #626262;
            --nothing-red: #D71921;
            --dot-grid: rgba(255, 255, 255, 0.04);
        }

        /* MODO DÍA NOTHING OS (automático si el móvil/PC está en modo claro) */
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg-main: #F3F3F3;
                --bg-panel: #E9E9E9;
                --bg-card: #FFFFFF;
                --bg-input: #FFFFFF;
                --bg-hover: #E5E5E5;
                --bg-listening: #FAFAFA;
                --header-bg: rgba(243, 243, 243, 0.88);
                --overlay-bg: rgba(230, 230, 230, 0.84);
                --border: #DCDCDC;
                --border-strong: #AEAEAE;
                --text-main: #141414;
                --text-strong: #000000;
                --text-muted: #666666;
                --user-bubble-bg: #181818;
                --user-bubble-text: #F5F5F5;
                --btn-disabled-bg: #DCDCDC;
                --btn-disabled-text: #999999;
                --nothing-red: #D71921;
                --dot-grid: rgba(0, 0, 0, 0.055);
            }
        }

        :root[data-theme="light"] {
            --bg-main: #F3F3F3;
            --bg-panel: #E9E9E9;
            --bg-card: #FFFFFF;
            --bg-input: #FFFFFF;
            --bg-hover: #E5E5E5;
            --bg-listening: #FAFAFA;
            --header-bg: rgba(243, 243, 243, 0.88);
            --overlay-bg: rgba(230, 230, 230, 0.84);
            --border: #DCDCDC;
            --border-strong: #AEAEAE;
            --text-main: #141414;
            --text-strong: #000000;
            --text-muted: #666666;
            --user-bubble-bg: #181818;
            --user-bubble-text: #F5F5F5;
            --btn-disabled-bg: #DCDCDC;
            --btn-disabled-text: #999999;
            --nothing-red: #D71921;
            --dot-grid: rgba(0, 0, 0, 0.055);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            padding-bottom: 12px;
            padding-left: max(18px, env(safe-area-inset-left, 18px));
            padding-right: max(18px, env(safe-area-inset-right, 18px));
            background: rgba(27, 27, 27, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--nothing-red);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(215, 25, 33, 0.85);
            transition: all 0.3s ease;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-top-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-top-btn:hover {
            color: var(--text-main);
            border-color: #555555;
            background: #2E2E2E;
        }

        /* BARRA DE ATAJOS */
        .quick-actions-bar {
            border-bottom: 1px solid var(--border);
            background: var(--bg-main);
            flex-shrink: 0;
            width: 100%;
        }

        .quick-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            overflow-x: auto;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .chip svg {
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .chip:hover:not(:disabled) {
            border-color: var(--text-main);
            background: #2F2F2F;
        }
        .chip:hover:not(:disabled) svg { color: var(--text-main); }
        .chip:disabled { opacity: 0.45; cursor: not-allowed; }

        .chip-action {
            background: transparent;
            border: 1px dashed var(--border-strong);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .chip-action:hover { color: var(--text-main); border-color: var(--text-main); background: var(--bg-card); }

        /* CHAT BOX */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .message {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 86%;
            line-height: 1.55;
            font-size: 14.5px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--text-main);
            color: var(--bg-main);
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .assistant strong { color: #FFFFFF; font-weight: 600; }

        /* FORMATO RICO DE LISTAS Y BADGES ESTILO NOTHING OS */
        .msg-list-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 5px 0;
        }
        .msg-bullet {
            color: var(--nothing-red);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            line-height: 1.5;
            flex-shrink: 0;
        }
        .nothing-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }
        .nothing-badge.pending {
            border-color: rgba(215, 25, 33, 0.5);
            color: var(--nothing-red);
        }
        .nothing-badge.done {
            opacity: 0.65;
        }

        .memory-saved-pill {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .memory-saved-pill:hover { color: var(--text-main); }
        .memory-saved-pill span.dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--nothing-red);
            display: inline-block;
        }

        /* RECIBOS VERIFICADOS DE ACCIONES (ESTILO NOTHING OS) */
        .action-receipts {
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px dashed var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .receipt-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1.2;
        }
        .receipt-chip.clickable {
            cursor: pointer;
        }
        .receipt-chip.clickable:hover {
            color: var(--text-main);
            border-color: #555555;
        }
        .receipt-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #22c55e;
        }
        .receipt-dot.memoria { background: var(--nothing-red); }
        .receipt-dot.calendar { background: #3b82f6; }
        .receipt-dot.tasks { background: #22c55e; }
        .receipt-type {
            color: var(--text-main);
            font-weight: 600;
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* BARRA INFERIOR NOTHING */
        .input-wrapper {
            padding-top: 10px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            padding-left: max(14px, env(safe-area-inset-left, 14px));
            padding-right: max(14px, env(safe-area-inset-right, 14px));
            background: var(--bg-main);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            width: 100%;
        }

        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 7px 9px 7px 18px;
            position: relative;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            min-height: 52px;
        }

        .input-area:focus-within {
            border-color: #555555;
        }

        .input-area.listening {
            background: #202020;
            border-color: var(--nothing-red);
            align-items: center;
        }

        textarea#userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            line-height: 22px;
            resize: none;
            max-height: 132px;
            min-height: 24px;
            height: 24px;
            padding: 0;
            margin: 7px 0;
            overflow-y: hidden;
            display: block;
        }
        textarea#userInput::placeholder {
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        textarea#userInput:disabled { opacity: 0.6; cursor: not-allowed; }

        .input-area.listening textarea#userInput {
            display: none;
        }

        .waveform-slot {
            display: none;
            flex: 1;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            height: 36px;
            padding: 0 4px 0 0;
            overflow: hidden;
        }

        .input-area.listening .waveform-slot {
            display: flex;
        }

        .wave-bar {
            flex: 1;
            max-width: 4px;
            min-width: 2px;
            height: 3px;
            border-radius: 99px;
            background: var(--text-muted);
            transition: height 0.05s linear, background-color 0.08s ease;
        }
        .wave-bar.active {
            background: var(--text-main);
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-circle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }
        .action-circle-btn:hover:not(:disabled) {
            background: #303030;
            color: var(--text-main);
        }
        .action-circle-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .input-area.listening .action-circle-btn {
            background: rgba(215, 25, 33, 0.16);
            color: var(--nothing-red);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.04); }
        .send-btn:disabled {
            background: #303030;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(27, 27, 27, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .google-btn {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .google-btn:hover { opacity: 0.9; }

        /* LISTA DE ATAJOS Y MEMORIAS */
        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }
        .shortcut-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 9px 11px;
            border-radius: 10px;
        }
        .shortcut-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .shortcut-icon-preview {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            flex-shrink: 0;
        }
        .shortcut-icon-preview svg {
            width: 16px;
            height: 16px;
        }
        .shortcut-text-group {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .shortcut-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shortcut-prompt {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .shortcut-item-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mini-icon-btn {
            background: #2E2E2E;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .mini-icon-btn:hover:not(:disabled) {
            color: var(--text-main);
            border-color: var(--border-strong);
        }
        .mini-icon-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }
        .mini-icon-btn.delete:hover {
            color: var(--nothing-red);
            border-color: rgba(215, 25, 33, 0.5);
        }

        /* SELECTOR DE ICONOS */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-picker-trigger {
            width: 42px;
            height: 40px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color 0.15s;
        }
        .icon-picker-trigger:hover {
            border-color: var(--text-main);
        }
        .icon-picker-trigger svg {
            width: 18px;
            height: 18px;
        }

        .icon-picker-panel {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
        }
        .icon-picker-panel.open {
            display: grid;
        }
        .icon-option-btn {
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-option-btn svg {
            width: 16px;
            height: 16px;
        }
        .icon-option-btn:hover,
        .icon-option-btn.selected {
            color: var(--bg-main);
            background: var(--text-main);
            border-color: var(--text-main);
        }

        .form-input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus { border-color: var(--border-strong); }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        /* TEXTURA DOT-MATRIX Y COHERENCIA DÍA/NOCHE NOTHING OS */
        html, body {
            background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px);
            background-size: 18px 18px;
        }
        header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .modal-overlay {
            background: var(--overlay-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .message.user, .user {
            background: var(--user-bubble-bg);
            color: var(--user-bubble-text);
        }
        .message.assistant, .assistant {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .assistant strong { color: var(--text-strong); }
        .icon-top-btn:hover, .chip:hover:not(:disabled), .action-circle-btn:hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }
        .input-area:focus-within { border-color: var(--border-strong); }
        .input-area.listening { background: var(--bg-listening); }
        .send-btn {
            background: var(--user-bubble-bg);
            color: var(--user-bubble-text);
        }
        .send-btn:disabled {
            background: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
        }
        .mini-icon-btn { background: var(--bg-card); }
        .receipt-chip.clickable:hover {
            color: var(--text-main);
            border-color: var(--border-strong);
        }

        /* MODAL DE MEMORIA CLON DE CLAUDE (ESTÉTICA NOTHING OS) */
        .memory-modal-card {
            max-width: 660px;
            width: 94%;
            padding: 0;
            overflow: hidden;
            gap: 0;
            height: min(82vh, 660px);
            display: flex;
            flex-direction: column;
        }
        .mem-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .mem-breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: var(--text-main);
        }
        .mem-back-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 5px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .mem-back-btn:hover { border-color: var(--border-strong); background: var(--bg-hover); }

        .mem-body {
            flex: 1;
            overflow-y: auto;
            padding: 18px 20px;
        }
        .mem-section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin: 18px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mem-section-title:first-child { margin-top: 0; }
        .mem-section-title::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--nothing-red);
        }

        .mem-row {
            display: grid;
            grid-template-columns: minmax(115px, 165px) 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .mem-row:hover { background: var(--bg-hover); }
        .mem-row-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-strong);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mem-row-summary {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mem-row-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        @media (max-width: 560px) {
            .mem-row {
                grid-template-columns: 1fr auto;
                gap: 4px 10px;
            }
            .mem-row-summary { grid-column: 1 / -1; }
        }

        /* VISTA DETALLE DEL BLOQUE */
        .mem-detail-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .mem-detail-title {
            font-size: 19px;
            font-weight: 600;
            color: var(--text-strong);
        }
        .mem-delete-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .mem-delete-btn:hover {
            border-color: var(--nothing-red);
            color: var(--nothing-red);
        }
        .mem-detail-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .mem-detail-text {
            font-size: 14px;
            line-height: 1.55;
            color: var(--text-main);
        }
        .mem-detail-list {
            padding-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-main);
        }
        .mem-detail-list li::marker { color: var(--nothing-red); }
        .mem-slug-link {
            color: var(--text-strong);
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 3px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
        }
        .mem-slug-link:hover { color: var(--nothing-red); }

        /* BARRA INFERIOR "DILE A JARVIS QUÉ DEBE CAMBIAR" */
        .mem-footer-bar {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .mem-edit-form {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 5px 6px 5px 16px;
        }
        .mem-edit-form:focus-within { border-color: var(--border-strong); }
        .mem-edit-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 13.5px;
            font-family: inherit;
        }
        .mem-edit-input::placeholder { color: var(--text-muted); }
        .mem-edit-send {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--user-bubble-bg);
            color: var(--user-bubble-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .mem-edit-send:disabled {
            background: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            cursor: not-allowed;
        }

        /* DESPLEGABLE DE RECIBOS EN LOTES GRANDES (NOTHING OS) */
        .receipts-accordion {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .receipts-summary {
            list-style: none;
            cursor: pointer;
            padding: 8px 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }
        .receipts-summary::-webkit-details-marker { display: none; }
        .receipts-summary:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }
        .receipts-summary-left {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            line-height: 1.3;
        }
        .receipts-summary-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .receipts-summary-title {
            color: var(--text-strong);
            font-weight: 600;
        }
        .receipts-chevron {
            flex-shrink: 0;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }
        .receipts-accordion[open] .receipts-chevron {
            transform: rotate(180deg);
        }
        .receipts-accordion-body {
            padding: 8px 10px 10px;
            border-top: 1px dashed var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .msg-heading {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-strong);
            margin: 12px 0 6px 0;
        }
        .msg-divider {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 12px 0;
        }
    </style>
</head>
